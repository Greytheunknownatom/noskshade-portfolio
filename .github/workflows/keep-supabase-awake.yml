# LEARN (lesson 7): free Supabase projects pause after 7 days with no activity.
# GitHub runs this every 3 days for free; it calls the tiny ping() function in the database.
name: Keep Supabase awake
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -fsS -X POST "https://ajjxsdjifycxkoahvftn.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_2-zW15Yj0URr_9wzjEnmQQ_BUMHkj_n" \
            -H "Content-Type: application/json" -d '{}'
