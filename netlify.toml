# LEARN (lesson 7): Netlify reads this on every deploy. It detects Next.js and runs it with its
# Next.js runtime (static pages on the CDN, server parts as functions), set by the plugin below.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Runs Next.js properly on Netlify (server pages, images, admin). Without it Netlify
# uploads the build folder as plain files and every page shows "Page not found".
[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Old share links from the previous site still work.
[[redirects]]
  from = "/blog/:slug/index.html"
  to = "/blog/:slug"
  status = 301
